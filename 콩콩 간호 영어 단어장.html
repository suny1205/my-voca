<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7fd8c0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>콩콩 간호 영어 단어장</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{--bg:#eefaf6;--card:#fff;--ink:#2b4a4a;--sub:#6b8a88;--mint:#7fd8c0;--mint2:#d9f5ec;--pink:#ff7f9f;--pink2:#ffe3ea;--line:#cfeae3;--ok:#2fae7f;--bad:#e5586f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15262a;--card:#1e3338;--ink:#e3f4f0;--sub:#9bbdb7;--mint:#4cb89d;--mint2:#244449;--pink:#ff8fab;--pink2:#4a2a36;--line:#2e4a50}}
:root[data-theme="dark"]{--bg:#15262a;--card:#1e3338;--ink:#e3f4f0;--sub:#9bbdb7;--mint:#4cb89d;--mint2:#244449;--pink:#ff8fab;--pink2:#4a2a36;--line:#2e4a50}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.55}
h1,h2,.en{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px 104px}
header{text-align:center;padding:6px 0 10px}
h1{font-size:1.7rem;margin:0;color:var(--pink)}
header p{margin:4px 0 0;color:var(--sub)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;max-width:720px;margin:0 auto;display:flex;background:var(--card);border-top:2px solid var(--line);border-radius:22px 22px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--sub);font-family:"Jua",sans-serif;font-size:.85rem;min-height:56px;padding:6px 4px;border-radius:16px;cursor:pointer}nav button b{font-size:1.4rem;line-height:1;font-weight:400;padding:3px 20px;border-radius:999px}
nav button.on{color:var(--pink)}nav button.on b{background:var(--pink2)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
section{display:none}section.on{display:block}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin:0 -16px;padding:6px 16px 0}
.chip{border:2px solid var(--line);background:var(--card);color:var(--sub);font:inherit;padding:7px 14px;flex:none;white-space:nowrap;border-radius:999px;cursor:pointer}
.chip.on{background:var(--pink2);border-color:var(--pink);color:var(--pink)}
.count{color:var(--sub);font-size:.9rem;margin:0 0 8px 4px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.en{font-size:1.5rem}
.pron{background:var(--pink2);color:var(--pink);border-radius:999px;padding:1px 12px;font-size:.92rem}
.m{font-size:1.1rem;margin:6px 0 2px;font-weight:700}
.d{color:var(--sub);margin:0;font-size:.95rem}
.tag{margin-left:auto;background:var(--mint2);color:var(--ink);border-radius:999px;padding:1px 10px;font-size:.8rem}
.ic{border:0;background:var(--mint2);border-radius:50%;width:42px;height:42px;cursor:pointer;font-size:1rem}
.del{border:0;background:none;color:var(--sub);cursor:pointer;font:inherit;font-size:.85rem;padding:4px 6px;margin-top:6px}
.btn{border:0;background:var(--pink);color:#fff;font-family:"Jua",sans-serif;font-size:1.1rem;padding:12px 22px;border-radius:999px;cursor:pointer}
.btn.alt{background:var(--mint);color:#143a33}
.fld{margin-bottom:12px}.fld label{display:block;margin:0 0 4px 4px;color:var(--sub);font-size:.9rem}
h2{font-size:1.4rem;margin:0 0 10px}
.mode{display:flex;gap:8px;margin:10px 0 16px;flex-wrap:wrap}
.prog{height:12px;background:var(--mint2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--mint);transition:width .3s}
.q{text-align:center;padding:22px 14px}
.q .en{font-size:2.1rem}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:1.05rem;padding:13px;border-radius:16px;cursor:pointer;text-align:center}
.opt.ok{background:var(--mint2);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--pink2);border-color:var(--bad);color:var(--bad)}
.fb{min-height:48px;margin:12px 0 4px;text-align:center;color:var(--sub)}
.score{font-family:"Jua",sans-serif;font-size:3rem;color:var(--pink);text-align:center;margin:6px 0}
.center{text-align:center}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.empty{text-align:center;color:var(--sub);padding:28px 0}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{overscroll-behavior-y:none}.opt{min-height:54px}.del{min-height:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🩺 콩콩 간호 영어 단어장</h1><p>실습 나가기 전, 하루 10분 단어 익히기</p></header>
<nav id="nav">
<button data-t="list" class="on" aria-label="단어장"><b>📖</b>단어장</button>
<button data-t="add" aria-label="단어 추가"><b>✏️</b>단어 추가</button>
<button data-t="quiz" aria-label="퀴즈"><b>🎯</b>퀴즈</button>
</nav>

<section id="list" class="on">
<div class="sticky"><div class="bar"><input id="s" type="search" placeholder="영어 또는 한글로 찾기" aria-label="단어 검색"></div>
<div class="chips" id="chips"></div></div>
<p class="count" id="cnt"></p>
<div id="words"></div>
</section>

<section id="add">
<div class="card">
<h2>새 단어 넣기</h2>
<div class="fld"><label for="aw">영어 단어 *</label><input id="aw" placeholder="예: pulse oximeter" autocomplete="off"></div>
<div class="fld"><label for="ap">한글 발음</label><input id="ap" placeholder="예: 펄스 악시미터" autocomplete="off"></div>
<div class="fld"><label for="am">뜻 *</label><input id="am" placeholder="예: 산소포화도 측정기" autocomplete="off"></div>
<div class="fld"><label for="ad">한글 설명</label><input id="ad" placeholder="예: 손가락에 끼워 SpO2를 재요." autocomplete="off"></div>
<div class="fld"><label for="ac">분류</label><input id="ac" list="cl" placeholder="고르거나 직접 입력"><datalist id="cl"></datalist></div>
<button class="btn" id="addb" style="width:100%">단어 저장하기</button>
</div>
</section>

<section id="quiz"></section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const SEED=[
["blood pressure","블러드 프레셔","혈압","혈액이 혈관 벽을 미는 힘이에요. mmHg로 재요.","활력징후"],
["pulse","펄스","맥박","심장이 뛸 때 동맥에서 느껴지는 박동이에요.","활력징후"],
["temperature","템퍼러처","체온","몸의 온도예요. 정상은 약 36.5℃예요.","활력징후"],
["respiration","레스퍼레이션","호흡","숨을 들이쉬고 내쉬는 것이에요.","활력징후"],
["oxygen saturation","악시전 새처레이션","산소포화도","혈액 속 헤모글로빈이 산소와 결합한 정도(SpO2)예요.","활력징후"],
["fever","피버","발열","체온이 정상보다 높아진 상태예요.","증상"],
["nausea","노지아","메스꺼움","토할 것 같은 느낌이에요.","증상"],
["vomiting","바미팅","구토","위 내용물을 입으로 토하는 것이에요.","증상"],
["dyspnea","딥스니아","호흡곤란","숨쉬기가 힘들다고 느끼는 증상이에요.","증상"],
["edema","이디마","부종","조직에 체액이 고여 붓는 것이에요.","증상"],
["dizziness","디지니스","어지러움","머리가 빙글빙글 도는 느낌이에요.","증상"],
["pain","페인","통증","아픈 느낌이에요. 0~10점으로 점수를 물어봐요.","증상"],
["medication","메디케이션","투약, 약물","환자에게 약을 주는 일 또는 약 자체를 말해요.","투약·처치"],
["dose","도우스","용량","한 번에 주는 약의 양이에요.","투약·처치"],
["injection","인젝션","주사","바늘로 약물을 몸에 넣는 방법이에요.","투약·처치"],
["allergy","앨러지","알레르기","특정 물질에 몸이 과민하게 반응하는 것이에요.","투약·처치"],
["dressing","드레싱","상처 소독·드레싱","상처를 소독하고 덮어주는 처치예요.","투약·처치"],
["wound","우운드","상처","피부나 조직이 손상된 부위예요.","투약·처치"],
["stethoscope","스테써스코프","청진기","심장·폐 소리를 듣는 도구예요.","기구"],
["syringe","시린지","주사기","약물을 넣거나 뽑을 때 쓰는 기구예요.","기구"],
["catheter","캐써터","카테터","체내에 넣어 액체를 넣거나 빼는 가느다란 관이에요.","기구"],
["bandage","밴디지","붕대","상처나 부위를 감싸는 천이에요.","기구"],
["hypertension","하이퍼텐션","고혈압","혈압이 계속 높은 상태예요.","질환"],
["diabetes","다이어비티스","당뇨병","혈당 조절이 잘 안 되는 질환이에요.","질환"],
["infection","인펙션","감염","세균·바이러스가 몸에 들어와 번식하는 것이에요.","질환"],
["inflammation","인플러메이션","염증","붓고 열나고 아픈 몸의 방어 반응이에요.","질환"],
["assessment","어세스먼트","사정(평가)","환자 상태를 모으고 살피는 간호과정의 첫 단계예요.","간호"],
["admission","어드미션","입원","환자가 병원에 들어와 치료받기 시작하는 것이에요.","간호"],
["discharge","디스차지","퇴원","치료를 마치고 병원에서 나가는 것이에요.","간호"],
["informed consent","인폼드 컨센트","설명 후 동의","충분히 설명을 듣고 환자가 동의하는 것이에요.","간호"]
];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let custom=[];try{custom=JSON.parse(localStorage.getItem("nursing-vocab")||"[]")}catch(e){}
const save=()=>{try{localStorage.setItem("nursing-vocab",JSON.stringify(custom))}catch(e){}};
const all=()=>SEED.map(a=>({w:a[0],p:a[1],m:a[2],d:a[3],c:a[4]})).concat(custom);
let cat="전체",q="";

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function speak(w){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u)}catch(e){toast("이 브라우저는 소리 재생을 지원하지 않아요")}}
const spk=w=>`<button class="ic" data-say="${esc(w)}" aria-label="${esc(w)} 발음 듣기">🔊</button>`;

function cats(){return[...new Set(all().map(x=>x.c))]}
function renderList(){
  $("#chips").innerHTML=["전체",...cats()].map(c=>`<button class="chip ${c===cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
  $("#cl").innerHTML=cats().map(c=>`<option value="${esc(c)}">`).join("");
  const k=q.trim().toLowerCase();
  const L=all().filter(x=>(cat==="전체"||x.c===cat)&&(!k||x.w.toLowerCase().includes(k)||x.m.includes(k)));
  $("#cnt").textContent=`단어 ${L.length}개`;
  $("#words").innerHTML=L.length?L.map(x=>`<div class="card"><div class="top"><span class="en">${esc(x.w)}</span>${x.p?`<span class="pron">[${esc(x.p)}]</span>`:""}${spk(x.w)}<span class="tag">${esc(x.c)}</span></div><p class="m">${esc(x.m)}</p>${x.d?`<p class="d">${esc(x.d)}</p>`:""}${x.id?`<button class="del" data-del="${x.id}">내가 추가한 단어 지우기</button>`:""}</div>`).join(""):`<div class="empty">찾는 단어가 없어요. '단어 추가'에서 직접 넣어보세요!</div>`;
}

function addWord(){
  const w=$("#aw").value.trim(),m=$("#am").value.trim();
  if(!w||!m){toast("영어 단어와 뜻을 입력해 주세요");return}
  if(all().some(x=>x.w.toLowerCase()===w.toLowerCase())){toast("이미 있는 단어예요");return}
  custom.push({id:Date.now(),w,p:$("#ap").value.trim(),m,d:$("#ad").value.trim(),c:$("#ac").value.trim()||"내 단어"});
  save();["aw","ap","am","ad","ac"].forEach(i=>$("#"+i).value="");
  renderList();toast("단어를 저장했어요!");$("#aw").focus();
}

/* 퀴즈 */
let Q={mode:"en"};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function quizHome(){
  const n=all().length;
  $("#quiz").innerHTML=`<div class="card center"><h2>단어 퀴즈</h2><p class="d">${n<4?"퀴즈는 단어가 4개 이상이어야 해요.":"뜻이 맞는 보기를 골라보세요. 한 판에 최대 10문제예요."}</p><div class="mode" style="justify-content:center"><button class="chip ${Q.mode==="en"?"on":""}" data-mode="en">영어 → 한글</button><button class="chip ${Q.mode==="ko"?"on":""}" data-mode="ko">한글 → 영어</button></div><button class="btn" id="go" ${n<4?"disabled":""}>시작하기</button></div>`;
}
function startQuiz(){
  const pool=all();
  Q.qs=shuffle(pool).slice(0,Math.min(10,pool.length)).map(t=>({t,o:shuffle([t,...shuffle(pool.filter(x=>x!==t)).slice(0,3)])}));
  Q.i=0;Q.s=0;Q.wrong=[];showQ();
}
function showQ(){scrollTo(0,0);
  const {t,o}=Q.qs[Q.i],en=Q.mode==="en";
  $("#quiz").innerHTML=`<div class="prog"><i style="width:${Q.i/Q.qs.length*100}%"></i></div><p class="count center">${Q.i+1} / ${Q.qs.length}</p><div class="card q">${en?`<div class="en">${esc(t.w)}</div>${t.p?`<div class="pron" style="display:inline-block;margin-top:6px">[${esc(t.p)}]</div>`:""} ${spk(t.w)}`:`<div class="en">${esc(t.m)}</div>`}<div class="opts">${o.map((x,k)=>`<button class="opt" data-k="${k}">${esc(en?x.m:x.w)}</button>`).join("")}</div><div class="fb" id="fb"></div><button class="btn alt" id="next" style="display:none;width:100%">${Q.i+1<Q.qs.length?"다음 문제":"결과 보기"}</button></div>`;
}
function answer(k){
  const {t,o}=Q.qs[Q.i];if(Q.done)return;Q.done=true;
  const btns=[...document.querySelectorAll(".opt")],right=o.indexOf(t),ok=k===right;
  btns[right].classList.add("ok");if(!ok){btns[k].classList.add("bad");Q.wrong.push(t)}else Q.s++;
  $("#fb").innerHTML=`<b style="color:var(--${ok?"ok":"bad"})">${ok?"정답이에요! 🎉":"아쉬워요, 다시 기억해요!"}</b><br>${esc(t.w)} = ${esc(t.m)}${t.d?`<br>${esc(t.d)}`:""}`;
  $("#next").style.display="block";
}
function result(){
  const n=Q.qs.length,msg=Q.s===n?"완벽해요! 실습 준비 끝 🩺":Q.s>=n*.7?"잘하고 있어요, 조금만 더!":"틀린 단어를 복습하고 다시 도전해요 💪";
  $("#quiz").innerHTML=`<div class="card center"><h2>결과</h2><div class="score">${Q.s} / ${n}</div><p>${msg}</p>${Q.wrong.length?`<div style="text-align:left;margin:14px 0"><p class="count">다시 볼 단어</p>${Q.wrong.map(x=>`<div class="top" style="margin-bottom:6px"><span class="en" style="font-size:1.2rem">${esc(x.w)}</span><span>${esc(x.m)}</span></div>`).join("")}</div>`:""}<button class="btn" id="go">다시 풀기</button> <button class="btn alt" id="home">처음으로</button></div>`;
}

/* 이벤트 */
$("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));
  document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===b.dataset.t));
  if(b.dataset.t==="quiz")quizHome();scrollTo(0,0);};
$("#s").oninput=e=>{q=e.target.value;renderList()};
$("#addb").onclick=addWord;
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.say)speak(t.dataset.say);
  if(t.dataset.cat){cat=t.dataset.cat;renderList()}
  if(t.dataset.del){custom=custom.filter(x=>String(x.id)!==t.dataset.del);save();renderList();toast("단어를 지웠어요")}
  if(t.dataset.mode){Q.mode=t.dataset.mode;quizHome()}
  if(t.dataset.k!==undefined&&t.classList.contains("opt"))answer(+t.dataset.k);
  if(t.id==="go"){Q.done=false;startQuiz()}
  if(t.id==="next"){Q.done=false;Q.i++;Q.i<Q.qs.length?showQ():result()}
  if(t.id==="home")quizHome();
});
renderList();
</script>
</body>
</html>
